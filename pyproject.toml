[project]
name = "demandtest"
version = "0.2.4"
description = "Demand-driven static discovery of project-specific knowledge for efficient, intention-aligned unit test generation."
requires-python = ">=3.10"
# Stdlib only (SPEC §3); tiktoken is optional for packet token estimation.
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["demandtest"]
